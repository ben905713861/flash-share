name: Tag Tauri Release

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read Tauri version
        id: version
        shell: bash
        run: |
          VERSION="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("react_native/src-tauri/tauri.conf.json", "utf8")); process.stdout.write(config.version);')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Tauri version: $VERSION" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $TAG_COMMIT, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to this commit."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Start Tauri release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run tauri-release.yml --repo "$GITHUB_REPOSITORY" --ref master -f "tag=$RELEASE_TAG"
