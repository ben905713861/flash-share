name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'react_native/src/**'
      - 'react_native/assets/**'
      - 'react_native/app.json'
      - 'react_native/app.config.js'
      - 'react_native/package.json'
      - 'react_native/package-lock.json'
      - 'react_native/plugins/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react_native/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        working-directory: react_native
        run: npm ci

      - name: Generate Android project
        working-directory: react_native
        run: npx expo prebuild --platform android --no-install

      - name: Build arm64 APK and AAB
        working-directory: react_native/android
        run: ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flash-share-android-arm64-apk
          path: react_native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: flash-share-android-arm64-aab
          path: react_native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
